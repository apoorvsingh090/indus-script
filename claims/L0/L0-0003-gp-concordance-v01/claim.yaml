preregistered_threshold: "Frozen method: join on M-number (G rows: site==Mohenjo-daro, cisi_number ^M-?\\d+[A-Z]?$; mayig ids ^M-?(\\d+)); G orientation = corrected order (reverse when reading_direction=='L-R'); P orientation = BOTH global variants scored, select higher sum of per-G-sign top-pair counts (both totals reported); align every equal-length (G-row, P-side) pair positionally; classify per G-sign g with n_g aligned occurrences: clean iff n_g>=5 AND support(g,p1)>=5 texts AND C[g][p1]>=0.9*n_g AND g is p1's top source AND C[g][p1]>=0.9*n_p1; contested iff n_g>=5 with reason (near-tie C[g][p2]>=0.8*C[g][p1] / reverse-conflict / low-consistency); unmapped iff n_g<5. GATE: >=20 clean pairs, bijective over clean, clean+contested+unmapped == distinct G-signs observed at aligned positions (no silent drops), every sign listed in data/concordance/gp-v01.csv with evidence counts, and join reproduces the pre-measured design inputs shared==161 M-numbers / equal-length pairs>0. Holdout (every 5th sorted shared M-number; infer on rest) REPORT-ONLY. Design inputs measured pre-prereg and disclosed: shared=161, equal-length-candidate texts=140/161, G motif on shared rows all Bull1:*. No mapping/classification computed before this commit."
result: "GATE PASS (reproduced 2/2 skeptics) — shared=161 M-numbers, 140 equal-length (G-row,P-side) pairs, 768 aligned positions, 192 G-signs observed; P-orientation rule decisive (reversed top-sum 741 vs as-stored 267 — mayig side sequences stored opposite to G corrected order; convention finding; 1 disclosed bit, selected on gated data); 22 clean bijective G->P pairs (G740->P324 75/76, G2->P122 60/63, G220->P050 27/29), 19 contested, 151 unmapped; classes reconcile 22+19+151=192; holdout (report-only) 0.980 at clean-mapped positions (48/49; single miss is G220 predicted P050 vs actual P060/P056 — sign-split artifact adjacent to clean G235->P060). Composition with pwm-v01: all 22 clean P codes present, 15 chain clean-1:1 to M-codes. SKEPTIC QUALIFICATIONS FOLDED IN (gate unaffected): (1) threshold-stable core is 16 pairs — 6 of 22 sit exactly at support 5 and drop under support>=6 or consistency>=0.95 (skL0-C, skL0-D); downstream claims should compose on the stable core or re-justify thresholds. (2) Permutation control: random equal-length pairing yields 0/200 clean pairs (max top-pair count 11 vs real 75) — coincidental-consistency floor ~0; the mapping is positional evidence, not a numbering artifact (skL0-D). (3) Duplicate inflation absent: 161/161 shared G sequences distinct, dedup rerun is a no-op (skL0-D). (4) Contested REASON labels are underdetermined by the prereg (skL0-D labels 17 reverse-conflict / 2 low-consistency vs shipped 15/4; classes and evidence counts identical). (5) argmax tie-breaks unspecified in prereg; ties occur only at count 1 in the unmapped tail (skL0-D). (6) Equal-length-only alignment discards 21 shared texts, no indel modeling — conservative; edit-distance variant is v0.2 future work (skL0-D). (7) Provenance caveat: indus_website cisi_number values may derive from concordance cross-referencing; permutation control shows the bridge does not depend on it (skL0-D). (8) CSV amendment post-review: unmapped rows now ship top-pair + true evidence counts (skL0-C objection; classification unchanged, checker green). checker recompute=match, gate PASS exit 0."
skeptics: [skL0-C, skL0-D]
status: verified  # 2/2 reproductions; threshold-stable core 16; qualification list above before downstream composition
limitations:
  - "Type-level and provisional: clean pairs are frequency-and-position evidence, NOT glyph identity proof; editorial convention differences (sign splits, numerals, damaged signs) will surface as contested/unmapped rather than resolved."
  - "Evidence base is 161 Mohenjo-daro unicorn-seal texts (~700 aligned positions) — only frequent G-signs can clear support>=5; the tail stays unmapped by design."
  - "P orientation is selected by an aggregate rule from the data (both variants reported); a wrong convention would depress consistency and show up as contested, not silent error."
  - "mayig MIT allows redistribution; the joy CSV remains fetch-at-build (yajnadevam transcription terms) — the concordance CSV ships codes+counts only, no corpus text."
  - "Same-object guarantee rests on M-number equality across two independent digitizations; the 18 unshared mayig numbers and any M-daro G rows without M-numbers are excluded and counted."
