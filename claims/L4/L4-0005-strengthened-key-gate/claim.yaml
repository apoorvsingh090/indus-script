preregistered_threshold: "Frozen method: joint objective = bigram LL (ln P_ref(q|p)=(ref_bigram+a)/(ref_unigram+a*372), within-window adjacent cipher pairs) + positional LL (ln P_ref(cls|p)=(ref_pos[p][cls]+a)/(ref_unigram[p]+3a), cls = begin/middle/end per the L1-0002b convention, len-1 = begin only; no free weight); search = steepest-ascent pairwise swaps (full sweep, first row-major max, accept iff delta>1e-12, cap 2000) with swap delta = bigram + positional parts; multi-start best-of-3 (rank-init count-desc/sign-asc + Random(42000001/+2) permutations, best exact total objective, ties to earlier start); a* by the L4-0004 dev rule = smallest a in [0.001,0.01,0.1,0.2,0.5,1.0] with >=7/10 top-10 on the dev key at N_ref=500 (Counter.most_common(10)). STRENGTHENED GATE (all required): (a) a* exists; (b) committed key top-10 >= 8/10 at N_ref=974; (c) >= 2 of 3 gate keys >= 8/10 at 974; (d) committed full-key accuracy at 974 > null_max AND >= 1.5*null_max, null_max = max full-key over K=12 structureless controls (within-window permutation of the reference, seeds 777000000+i, rank-init single-start climb — method asymmetry disclosed, margin covers it; 2 controls at full best-of-3 report-only); (e) sampling arm: the two disjoint 487-window halves of the cipher corpus (committed key) each reach top-10 >= 6/10. DISCLOSED: the strengthened-gate design is the L4-0004 skeptics' specification (sk4-A/sk4-B) — this claim implements their review; the FRESH cell (new pool/window/key seeds, never measured) keeps the outcome open; method additions (positional term, multi-start) answer the diagnosed failure modes (local optima; zero slack at 7/10). Design inputs (pools, windows, V_U5=372, key shas) measured pre-prereg per L4-0002 precedent; NO recovery, dev sweep, or null run on this cell before this commit."
result: "CONFIRMED NEGATIVE (dev-cell failure) — on the FRESH cell no alpha in the grid reaches the 7/10 dev bar at N_ref=500 (2/3/4/4/4/4 for alpha 0.001..1.0; best full-key 0.108 at alpha=1.0), so alpha*=None and the strengthened gate fails at condition (a) before any gated arm runs — filed per the frozen rule. Readings: (1) L4-0004's zero-slack pass was a boundary draw — the same protocol with a fresh pool/window/key draw (V 368->372) and a STRONGER method (positional augmentation + multi-start) does not even clear the dev bar at half reference; key recovery at Indus scale is at-or-beyond the feasibility boundary, not comfortably inside it. (2) The rank-init start beat both random restarts at every alpha (best-of-3 always selected start 0) — random restarts do not help at this data size. (3) Positional augmentation did not rescue the fresh cell (it was not the binding constraint here). Any L3 consideration stays shut pending a method that clears the strengthened gate on a fresh cell."
