preregistered_threshold: "Frozen inputs = L4-0002 key arm bit-exactly (974/974 halves, cipher = second half under committed key, V=370 asserted). Recovery method (frozen): init = unigram rank match with canonical sort (count desc, sign asc); objective = sum over adjacent within-window pairs of the cipher half of ln P_ref(m(c_i)->m(c_{i+1})) with P_ref=(ref_bigram+0.001)/(ref_unigram+0.001*370); search = deterministic steepest-ascent pairwise swaps, full sweep per step, first row-major maximum on ties, accept iff delta>1e-12, cap 2000 accepted swaps; no randomness. GATE (both required): (a) >=7 of the 10 most frequent cipher-half types (Counter.most_common(10), same convention as L4-0002) map exactly to true plaintext under the committed key; (b) >=2 of the 3 keys {committed, alt1, alt2} each reach >=7/10. Report-only (not gated): full-key exact accuracy, accepted-swap counts. Fixed 2026-10-23 before any L4-0003 gated number was computed; method prototyped only on an unrelated synthetic toy corpus, never on the Sumerian windows."
result: "CONFIRMED NEGATIVE (3/3 keys, reproduced 2/2 skeptics) — bigram hill-climb at preregistered alpha=0.001 does NOT clear the bar: committed 4/10, alt1 4/10, alt2 4/10 (all < 7; keys_ge7=0), and UNDERPERFORMS the rank-only init baseline (5/10, L4-0002) on top-10. Climb converges (326/318/303 accepted swaps < cap; skeptic band 309-328 across implementations, fp tie-noise), closes ~77% of the init-to-true log-likelihood gap (LL init -29975 -> final -19981 [skeptic band -19966..-19995] vs true key -17157) yet loses a top-10 hit. Mechanism consistent with L4-0002's flat mid-rank diagnosis (cipher ranks 2-7 within 18 tokens: 174/160/160/158/156/142). checker FAIL on gate arm as designed; recompute=match. SKEPTIC QUALIFICATIONS FOLDED IN (gate unaffected, scope narrowed): (1) alpha-fragile, NOT class-wide — sk3-B: same climb with alpha>=0.2 clears the bar, alpha=1.0 gives 10/10 on ALL three keys; alpha=0.001 was inherited from L4-0002's L2 context, not calibrated for recovery — a fresh prereg (alpha-calibrated rerun) is required before the hidden-key arm is treated as cleared or uncleared by hill-climbs generally. (2) reference-scope-conditional — sk3-A/sk3-B: with the full ~9k-token corpus as reference the frozen climb recovers 10/10 top-10 and ~77% of the full key (oracle bound; equal-size reference half is the honest decipherment scenario). (3) report-only fields not cross-implementation portable (float tie-noise on near-tied swaps); gated cells stable. (4) cosmetic: results.json n_texts is n_windows."
skeptics: [sk3-A, sk3-B]
status: verified  # negative confirmed 2/2 (prereg-configured recovery fails; alpha/reference-scope qualifications folded in)
