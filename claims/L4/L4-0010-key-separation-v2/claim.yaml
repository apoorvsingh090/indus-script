n occurrences (not types) decoded correctly, same definition for arms and nulls. Top-10, dev arm (N_ref=500), per-half decode diagnostics (wrap counts, bigram coherence under the committed key, reference token-mass) and band margins are shipped report-only. BAND POLICY: every gated comparison is also shipped as margin in type-count terms (/353); any pass-margin < 3/353 is flagged band-adjacent (would not be cross-implementation reproducible; would need a qualification note, not auto-rejection). DISCLOSED DERIVATIONS: 1.5x/1.25x/0.060 carried from L4-0009 as frozen constants (no re-derivation on cell #5 data); 1.25x token-weighted margin round-below the cell-#4-observed 1.45x; design lineage through verified-negative claims L4-0006 and L4-0009 (both 2/2 skeptics). Design inputs (pools, windows, V_U10=353, wrap/meanlen/pos-tail, key shas) measured pre-prereg at cell level only; NO recovery, partial recovery, dev sweep, or null run on this cell before this commit."
